name: Apply canvas safety fixes
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-apply-canvas-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply source fixes
        shell: python
        run: |
          import base64, lzma, hashlib, subprocess
          data = ''
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '10688252809d639ab230a6fb94c40bbed355e88d68bcae0b97988c1b53449d97'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert line.split()[2].startswith(('a/src/', 'a/tests/'))
                  assert line.split()[3].startswith(('b/src/', 'b/tests/'))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit fixes and remove transfer workflow
        run: |
          git rm .github/workflows/studio-apply-canvas-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): compile navigation commands and protect canvas gesture lifetimes'
          git push origin HEAD:feat/figma-inspired-workspace
