name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core2d-github-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  site-config:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      build_type: ${{ steps.site.outputs.build_type }}
      branch: ${{ steps.site.outputs.branch }}
      url: ${{ steps.site.outputs.url }}
    steps:
      - name: Read existing Pages publishing configuration without changing it
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > site.json
          python3 - <<'PY'
          import json, os
          site = json.load(open('site.json'))
          kind = site.get('build_type', 'legacy')
          branch = site.get('source', {}).get('branch', '')
          if kind != 'workflow' and (branch not in ('pages', 'gh-pages') or site.get('source', {}).get('path') != '/'):
              raise RuntimeError('Refusing to overwrite a source branch or an unexpected Pages path')
          values = {'build_type': kind, 'branch': branch, 'url': site['html_url']}
          print(json.dumps(values, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  if '\n' in value: raise ValueError('Invalid Pages metadata')
                  output.write(f'{key}={value}\n')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test compatibility adapters and presented-pixel contracts
        shell: bash
        run: |
          mkdir -p artifacts
          node --test tools/pages/screen-compat.test.mjs tools/pages/render-compat.test.mjs tools/pages/render-pixels.test.cjs | tee artifacts/browser-unit.tap
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish the actual Avalonia browser application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          dotnet publish src/Core2D.Browser/Core2D.Browser.csproj -c Release --nologo > artifacts/browser-publish.log 2>&1
          result=$?
          set -e
          tail -n 100 artifacts/browser-publish.log
          exit "$result"
      - name: Prepare complete Pages bundle and source manifest
        run: python3 tools/pages/prepare.py
      - name: Install pinned Chromium, WebKit and Firefox test engines
        run: |
          npm install --prefix "$RUNNER_TEMP/core2d-playwright" --no-save --no-package-lock playwright@1.55.1 pngjs@7.0.0
          "$RUNNER_TEMP/core2d-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Validate published application and recorded regressions
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p artifacts/preview/Core2D artifacts/local-browser
          cp -a artifacts/site/. artifacts/preview/Core2D/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory artifacts/preview > artifacts/preview-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/core2d-playwright/node_modules"
          result=0
          for scenario in screen-regression-negative webkit-render-negative chromium webkit webkit-standard-dpi firefox chromium-legacy-screen; do
            node tools/pages/smoke.cjs http://127.0.0.1:4173/Core2D/ "artifacts/local-browser/$scenario" "$scenario" > "artifacts/local-browser/$scenario.log" 2>&1 || result=1
            tail -n 35 "artifacts/local-browser/$scenario.log"
          done
          exit "$result"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - name: Retain build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-validation
          path: |
            artifacts/browser-unit.tap
            artifacts/browser-publish.log
            artifacts/preview-server.log
            artifacts/local-browser
            artifacts/site/deployment.json
          if-no-files-found: warn

  deploy-actions:
    if: github.ref == 'refs/heads/master' && needs.site-config.outputs.build_type == 'workflow'
    needs: [build, site-config]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy complete tested bundle
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    if: github.ref == 'refs/heads/master' && needs.site-config.outputs.build_type != 'workflow'
    needs: [build, site-config]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract the exact browser-tested artifact
        run: |
          mkdir site
          tar -xf pages-artifact/artifact.tar -C site
          test -f site/_framework/dotnet.js
          test -f site/deployment.json
      - name: Publish to the existing generated-site branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: ${{ needs.site-config.outputs.branch }}
          folder: site
          clean: true
          clean-exclude: CNAME
          force: false
          commit-message: 'Deploy Core2D ${{ github.sha }}'
      - name: Request Pages publication for token-authored commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess
          result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/pages/builds'], text=True, capture_output=True)
          print(result.stdout)
          if result.returncode and 'HTTP 409' not in result.stderr:
              raise RuntimeError(result.stderr)
          if result.returncode:
              print('Pages publication is already in progress; the live check will verify the source commit.')

  verify-live:
    needs: [site-config, deploy-actions, deploy-branch]
    if: ${{ !cancelled() && (needs.deploy-actions.result == 'success' || needs.deploy-branch.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium, WebKit and Firefox test engines
        run: |
          npm install --prefix "$RUNNER_TEMP/core2d-playwright" --no-save --no-package-lock playwright@1.55.1 pngjs@7.0.0
          "$RUNNER_TEMP/core2d-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Verify deployed commit and real editing in every browser engine
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SITE_URL: ${{ needs.site-config.outputs.url }}
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/core2d-playwright/node_modules"
          mkdir -p artifacts/live-browser
          result=0
          for scenario in chromium webkit webkit-standard-dpi firefox chromium-legacy-screen; do
            node tools/pages/smoke.cjs "$SITE_URL" "artifacts/live-browser/$scenario" "$scenario" > "artifacts/live-browser/$scenario.log" 2>&1 || result=1
            tail -n 35 "artifacts/live-browser/$scenario.log"
          done
          exit "$result"
      - name: Retain public-site screenshots and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-validation
          path: artifacts/live-browser
          if-no-files-found: warn
