name: Apply studio preview fix
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-preview-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply source patch
        shell: python
        run: |
          import base64, lzma, hashlib, subprocess
          data = ''
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '42167bdb2523abf66db5977f5972c528d27e01bd0e488530efe002a014df1d31'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert all(path[2:].startswith(('src/', 'tests/')) for path in line.split()[2:4])
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit fixes and remove transfer workflow
        run: |
          git rm .github/workflows/studio-preview-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): size block previews and reconnect their model subscriptions'
          git push origin HEAD:feat/figma-inspired-workspace
