name: Apply studio property refinement
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-apply-refinement.yml, '.github/studio-transfer/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply source change
        shell: python
        run: |
          from pathlib import Path
          import hashlib, lzma, subprocess
          parts = sorted(Path('.github/studio-transfer').glob('patch.*.bin'))
          assert len(parts) == 7
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == 'cf165dc72cdcd7fc36b79eb32692d4cb2c58cb16d14f5b6457422a8f7b0fddca'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert line.split()[2].startswith(('a/src/', 'a/tests/'))
                  assert line.split()[3].startswith(('b/src/', 'b/tests/'))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit refinement and remove transfer files
        shell: bash
        run: |
          git rm -r .github/studio-transfer .github/workflows/studio-apply-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(studio): add transactional property editors and Figma-style control system'
          git push origin HEAD:feat/figma-inspired-workspace
