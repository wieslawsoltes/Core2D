name: Studio source inspection
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-source-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture source and previous CI errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspection
          git archive --format=tar.gz HEAD > inspection/source.tar.gz
          gh api repos/wieslawsoltes/Core2D/actions/jobs/108281772334/logs > inspection/previous-ci.log || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          data = Path('inspection/previous-ci.log').read_text(errors='replace')
          errors = list(dict.fromkeys(re.sub(r'^\S+\s+', '', line) for line in data.splitlines() if re.search(r'\berror\b|\[FAIL\]|Failed\s+', line, re.I)))
          text = '\n'.join(errors[-80:])
          Path('inspection/previous-ci-errors.txt').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source-inspection
          path: inspection
          retention-days: 3
