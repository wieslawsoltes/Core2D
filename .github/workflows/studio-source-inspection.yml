name: Studio source inspection
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-source-inspection.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p inspection
          git archive --format=tar.gz HEAD > inspection/source.tar.gz
          git rev-parse HEAD > inspection/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source-inspection
          path: inspection
          retention-days: 3
