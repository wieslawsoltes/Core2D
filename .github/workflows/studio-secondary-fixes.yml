name: Apply secondary view fixes
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-secondary-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply source fixes
        shell: python
        run: |
          import base64, lzma, hashlib, subprocess
          data = ''
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '3aaac63c337b32a572d52b2c08223442efc4ef4c6e3a4de7720a620db66d7fb1'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert all(path[2:].startswith(('src/', 'tests/')) for path in line.split()[2:4])
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit and remove transfer workflow
        run: |
          git rm .github/workflows/studio-secondary-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): retain library commands and refine viewport settings and density'
          git push origin HEAD:feat/figma-inspired-workspace
