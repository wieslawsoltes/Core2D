name: Apply studio secondary views
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-apply-secondary.yml, '.github/studio-transfer/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply complete source patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib, lzma, subprocess
          parts = sorted(Path('.github/studio-transfer').glob('secondary.*.bin'))
          assert len(parts) == 4
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '42c3b7d78267357cb848448ba9871b501d2a6462c500833854919e385abc1b59'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  for path in line.split()[2:4]:
                      assert path[2:].startswith(('src/', 'tests/')) or path[2:] == 'Directory.Packages.props'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit refinement and remove transfer files
        run: |
          git rm -r .github/studio-transfer .github/workflows/studio-apply-secondary.yml .github/workflows/studio-source-inspection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(studio): redesign asset libraries, modal dialogs, export and script editing'
          git push origin HEAD:feat/figma-inspired-workspace
