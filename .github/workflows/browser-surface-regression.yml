name: Browser retained-buffer regression
on:
  push:
    branches: [fix/browser-redraw]
    paths:
      - .github/workflows/browser-surface-regression.yml
      - src/Core2D.Browser/wwwroot/render-compat.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare candidate bootstrap and pixel assertions
        shell: python
        run: |
          from pathlib import Path
          smoke = Path('tools/pages/smoke.cjs').read_text()
          replacements = {
            "const playwright = require('playwright');": "const playwright = require('playwright');\nconst { expectInk } = require('./render-pixels.cjs');\nconst visualSamples = [];",
            'expectedCommit: process.env.EXPECTED_COMMIT, checks:': 'expectedCommit: process.env.EXPECTED_COMMIT, visualSamples, checks:',
            "scenario.engine === 'webkit' ? 2 : 1": "Number(process.env.PROBE_DPR || 1)",
            "const before = await page.evaluate(() => core2dDiagnostics.GetShapeCount());": "const before = await page.evaluate(() => core2dDiagnostics.GetShapeCount());\n    await expectInk(page, output, 'blank', false, visualSamples);",
            "report.checks.push('Native pointer input creates a rectangle');": "report.checks.push('Native pointer input creates a rectangle');\n    await expectInk(page, output, 'draw', true, visualSamples);",
            "await page.keyboard.press('Control+y');": "await expectInk(page, output, 'undo', false, visualSamples);\n    await page.keyboard.press('Control+y');",
            "report.checks.push('Document undo and redo restore the expected shape count');": "report.checks.push('Document undo and redo restore the expected shape count');\n    await expectInk(page, output, 'redo', true, visualSamples);"
          }
          for old, new in replacements.items():
            assert smoke.count(old) == 1, old
            smoke = smoke.replace(old, new)
          injection = '''
          await page.route('**/main.js*', route => route.fulfill({contentType:'text/javascript', path:'src/Core2D.Browser/wwwroot/main.js'}));
          await page.route('**/render-compat.mjs*', route => route.fulfill({contentType:'text/javascript', path:'src/Core2D.Browser/wwwroot/render-compat.mjs'}));
          await page.addInitScript(() => {
            const before = [HTMLCanvasElement.prototype.getContext, window.requestAnimationFrame];
            globalThis.__renderAPIsUnchanged = () => before[0] === HTMLCanvasElement.prototype.getContext && before[1] === window.requestAnimationFrame;
          });
          '''
          smoke = smoke.replace('page.setDefaultTimeout(60000);', 'page.setDefaultTimeout(60000);' + injection)
          smoke = smoke.replace("report.success = true;\n  } catch", "assert.equal(await page.evaluate(() => globalThis.__renderAPIsUnchanged()), true);\n    report.success = true;\n  } catch")
          Path('tools/pages/smoke-surface.cjs').write_text(smoke)
      - name: Install pinned browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/core2d-playwright" --no-save --no-package-lock playwright@1.55.1 pngjs@7.0.0
          "$RUNNER_TEMP/core2d-playwright/node_modules/.bin/playwright" install --with-deps webkit chromium firefox
      - name: Validate exact candidate module against the published framework
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/core2d-playwright/node_modules"
          mkdir -p artifacts
          result=0
          for scenario in webkit chromium firefox; do
            PROBE_DPR=1 node tools/pages/smoke-surface.cjs https://wieslawsoltes.github.io/Core2D/ "artifacts/$scenario-1" "$scenario" > "artifacts/$scenario-1.log" 2>&1 || result=1
            tail -n 40 "artifacts/$scenario-1.log"
          done
          PROBE_DPR=2 node tools/pages/smoke-surface.cjs https://wieslawsoltes.github.io/Core2D/ artifacts/webkit-2 webkit > artifacts/webkit-2.log 2>&1 || result=1
          tail -n 40 artifacts/webkit-2.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-retained-buffer-regression
          path: artifacts
          retention-days: 14
