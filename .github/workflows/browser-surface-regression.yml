name: Browser surface presentation regression
on:
  push:
    branches: [fix/browser-redraw]
    paths: [.github/workflows/browser-surface-regression.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated presentation probes and pixel assertions
        shell: python
        run: |
          from pathlib import Path
          smoke = Path('tools/pages/smoke.cjs').read_text()
          replacements = {
            "const playwright = require('playwright');": "const playwright = require('playwright');\nconst { expectInk } = require('./render-pixels.cjs');\nconst visualSamples = [];",
            'expectedCommit: process.env.EXPECTED_COMMIT, checks:': 'expectedCommit: process.env.EXPECTED_COMMIT, visualSamples, checks:',
            "const before = await page.evaluate(() => core2dDiagnostics.GetShapeCount());": "const before = await page.evaluate(() => core2dDiagnostics.GetShapeCount());\n    await expectInk(page, output, 'blank', false, visualSamples);",
            "report.checks.push('Native pointer input creates a rectangle');": "report.checks.push('Native pointer input creates a rectangle');\n    await expectInk(page, output, 'draw', true, visualSamples);",
            "await page.keyboard.press('Control+y');": "await expectInk(page, output, 'undo', false, visualSamples);\n    await page.keyboard.press('Control+y');",
            "report.checks.push('Document undo and redo restore the expected shape count');": "report.checks.push('Document undo and redo restore the expected shape count');\n    await expectInk(page, output, 'redo', true, visualSamples);"
          }
          for old, new in replacements.items():
            assert smoke.count(old) == 1, old
            smoke = smoke.replace(old, new)
          injection = '''
          await page.addInitScript(mode => {
            // Test-only interception. Never published or used by the application bootstrap.
            const contexts = new Set();
            const getContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attrs) {
              const options = mode === 'preserve' && type.includes('webgl') ? {...attrs, preserveDrawingBuffer:true} : attrs;
              const ctx = getContext.call(this,type,options);
              if (ctx && type.includes('webgl')) contexts.add(ctx);
              return ctx;
            };
            let frames = 0, operations = 0;
            const raf = window.requestAnimationFrame;
            window.requestAnimationFrame = function(callback) {
              return raf.call(this,time => {
                callback(time);
                frames++;
                for (const ctx of contexts) {
                  if (ctx.isContextLost()) continue;
                  if (mode === 'flush') { ctx.flush(); operations++; }
                  if (mode === 'finish') { ctx.finish(); operations++; }
                  if (mode === 'clear-zero') { ctx.clear(0); operations++; }
                }
              });
            };
            globalThis.__presentationProbe = () => ({mode,frames,operations,contexts:contexts.size});
          }, process.env.PROBE_MODE);
          '''
          smoke = smoke.replace('page.setDefaultTimeout(60000);', 'page.setDefaultTimeout(60000);' + injection)
          smoke = smoke.replace('if (browser) await browser.close();', "if (page) report.presentationProbe = await page.evaluate(() => globalThis.__presentationProbe?.());\n    if (browser) await browser.close();")
          Path('tools/pages/smoke-surface.cjs').write_text(smoke)
      - name: Install pinned WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/core2d-playwright" --no-save --no-package-lock playwright@1.55.1 pngjs@7.0.0
          "$RUNNER_TEMP/core2d-playwright/node_modules/.bin/playwright" install --with-deps webkit
      - name: Check presented draw undo redo pixels
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/core2d-playwright/node_modules"
          mkdir -p artifacts
          result=0
          for mode in flush finish clear-zero preserve; do
            PROBE_MODE="$mode" node tools/pages/smoke-surface.cjs https://wieslawsoltes.github.io/Core2D/ "artifacts/$mode" webkit > "artifacts/$mode.log" 2>&1 || result=1
            tail -n 40 "artifacts/$mode.log"
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-surface-regression
          path: artifacts
          retention-days: 14
