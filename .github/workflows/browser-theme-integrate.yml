name: Integrate browser theme
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/browser-theme-integrate.yml, '.github/browser-transfer/**']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed source changes
        shell: python
        run: |
          from pathlib import Path
          import hashlib, lzma, subprocess
          parts = sorted(Path('.github/browser-transfer').glob('patch.*.bin'))
          assert len(parts) == 2
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '7bd6f6444a41df0d8097b88118efe9a7bbd70e3c74d227bd7de754409d228465'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert line.split()[2].startswith(('a/src/', 'a/tests/', 'a/samples/', 'a/tools/', 'a/.github/workflows/browser-theme.yml', 'a/Core2D.slnx'))
                  assert line.split()[3].startswith(('b/src/', 'b/tests/', 'b/samples/', 'b/tools/', 'b/.github/workflows/browser-theme.yml', 'b/Core2D.slnx'))
          # The permanent validation workflow is committed through the authorized connector,
          # not modified by the build job's contents-only token.
          exclude = '--exclude=.github/workflows/browser-theme.yml'
          subprocess.run(['git', 'apply', exclude, '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', exclude, '--index', '-'], input=patch, check=True)
      - name: Refine complete native templates and verify original coverage
        run: |
          python tools/browser-theme/refine_browser.py src/Avalonia.Themes.Browser
          python tools/browser-theme/verify_theme.py src/Avalonia.Themes.Browser
      - name: Commit reusable theme integration and remove transfer infrastructure
        run: |
          git add src/Avalonia.Themes.Browser
          git rm -r .github/browser-transfer .github/workflows/browser-theme-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(theme): adopt browser templates throughout Core2D and add independent catalog and package validation'
          git push origin HEAD:feat/figma-inspired-workspace
