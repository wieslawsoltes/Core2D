name: Browser rendered-history diagnostics
on:
  push:
    branches: [master]
    paths: [.github/workflows/browser-render-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated rendered-pixel diagnostics
        shell: python
        run: |
          import pathlib
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          source = pathlib.Path('tools/pages/smoke.cjs').read_text()
          helper = '''
          const { PNG } = require('pngjs');
          const visualSamples = [];
          async function expectInk(page, output, phase, present) {
            const started = Date.now();
            let samples;
            do {
              const bytes = await page.screenshot({ scale: 'css' });
              const image = PNG.sync.read(bytes);
              let count = 0, minX = Infinity, minY = Infinity, maxX = -1, maxY = -1;
              for (let y = 375; y < 550; y++) for (let x = 625; x < 840; x++) {
                const index = (y * image.width + x) * 4;
                if (image.data[index + 3] > 200 && image.data[index] < 100 && image.data[index+1] < 100 && image.data[index+2] < 100) {
                  count++; minX = Math.min(minX,x); maxX = Math.max(maxX,x); minY = Math.min(minY,y); maxY = Math.max(maxY,y);
                }
              }
              samples = {phase, present, count, minX, minY, maxX, maxY, elapsedMs: Date.now()-started};
              if (present ? count > 300 && maxX-minX > 100 && maxY-minY > 70 : count === 0) {
                visualSamples.push(samples);
                await fs.writeFile(path.join(output, `${phase}-pixels.png`), bytes);
                return;
              }
              await fs.writeFile(path.join(output, `${phase}-pixels-failure.png`), bytes);
              await page.waitForTimeout(200);
            } while (Date.now()-started < 10000);
            visualSamples.push(samples);
            throw new Error(`Rendered frame mismatch: ${JSON.stringify(samples)}`);
          }
          '''
          probe = '''
          await page.addInitScript(mode => {
            const probes = globalThis.__renderProbe = {contexts: [], calls: {}, raf: 0};
            const original = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, ...args) {
              if (mode === 'software' && type.includes('webgl')) return null;
              if (mode === 'webgl1' && type === 'webgl2') return null;
              const context = original.call(this, type, ...args);
              if (context && !probes.contexts.some(x => x.context === context))
                probes.contexts.push({type, context, canvas: this});
              return context;
            };
            for (const type of ['WebGLRenderingContext', 'WebGL2RenderingContext', 'CanvasRenderingContext2D']) {
              const proto = globalThis[type]?.prototype;
              if (!proto) continue;
              for (const name of ['clear', 'drawArrays', 'drawElements', 'flush', 'finish', 'putImageData']) {
                const fn = proto[name];
                if (typeof fn !== 'function') continue;
                proto[name] = function(...args) {
                  const key = `${type}.${name}`;
                  probes.calls[key] = (probes.calls[key] || 0)+1;
                  return fn.apply(this,args);
                };
              }
            }
            const raf = window.requestAnimationFrame;
            window.requestAnimationFrame = fn => raf.call(window,time => { probes.raf++; fn(time); });
          }, process.env.PROBE_MODE || 'default');
          '''
          source = source.replace('(async () => {', helper + '\n(async () => {', 1)
          source = source.replace('expectedCommit: process.env.EXPECTED_COMMIT, checks:', 'expectedCommit: process.env.EXPECTED_COMMIT, visualSamples, checks:')
          source = source.replace("scenario.engine === 'webkit' ? 2 : 1", "Number(process.env.PROBE_DPR || 2)")
          source = source.replace('page.setDefaultTimeout(60000);', 'page.setDefaultTimeout(60000);' + probe)
          source = source.replace("report.checks.push('Native pointer input creates a rectangle');", "report.checks.push('Native pointer input creates a rectangle');\n    await expectInk(page, output, 'draw', true);")
          source = source.replace("await page.keyboard.press('Control+y');", "await expectInk(page, output, 'undo', false);\n    await page.keyboard.press('Control+y');")
          source = source.replace("report.checks.push('Document undo and redo restore the expected shape count');", "report.checks.push('Document undo and redo restore the expected shape count');\n    await expectInk(page, output, 'redo', true);")
          source = source.replace('if (browser) await browser.close();', '''
            if (page) {
              const probe = await page.evaluate(() => {
                const p = globalThis.__renderProbe;
                return {calls: p.calls, raf: p.raf, contexts: p.contexts.map(x => ({type:x.type,
                  width:x.canvas.width, height:x.canvas.height, attributes:x.context.getContextAttributes?.(),
                  image: x.canvas.toDataURL('image/png')}))};
              }).catch(e => ({error:String(e)}));
              for (let i=0; i<(probe.contexts?.length||0); i++) {
                const x=probe.contexts[i];
                if (x.image?.startsWith('data:image/png;base64,')) await fs.writeFile(path.join(output,`framebuffer-${i}.png`),Buffer.from(x.image.split(',')[1],'base64'));
                delete x.image;
              }
              report.renderProbe=probe;
            }
            if (browser) await browser.close();
          ''')
          pathlib.Path('tools/pages/smoke-visual.cjs').write_text(source)
      - name: Install browser engines and PNG decoder
        run: |
          npm install --prefix "$RUNNER_TEMP/core2d-playwright" --no-save --no-package-lock playwright@1.55.1 pngjs@7.0.0
          "$RUNNER_TEMP/core2d-playwright/node_modules/.bin/playwright" install --with-deps webkit
      - name: Isolate rendering mode and pixel ratio without production API changes
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/core2d-playwright/node_modules"
          result=0
          for mode in default webgl1 software; do
            for dpr in 1 2; do
              PROBE_MODE="$mode" PROBE_DPR="$dpr" node tools/pages/smoke-visual.cjs https://wieslawsoltes.github.io/Core2D/ "artifacts/$mode-$dpr" webkit > "artifacts/$mode-$dpr.log" 2>&1 || result=1
              tail -n 45 "artifacts/$mode-$dpr.log"
            done
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-render-diagnostics
          path: artifacts
          retention-days: 7
