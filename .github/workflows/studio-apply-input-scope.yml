name: Apply studio input scoping
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-apply-input-scope.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/figma-inspired-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply source patch
        shell: python
        run: |
          import base64, lzma, hashlib, subprocess
          data = ''
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == 'e3b2e96c8b65e5fde55173ed184d4283ec11010954e8c627fbb41e96c699fa9e'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  assert line.split()[2].startswith(('a/src/', 'a/tests/'))
                  assert line.split()[3].startswith(('b/src/', 'b/tests/'))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Commit fixes and remove transfer workflow
        run: |
          git rm .github/workflows/studio-apply-input-scope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): isolate native editing shortcuts and synchronous viewport commands'
          git push origin HEAD:feat/figma-inspired-workspace
