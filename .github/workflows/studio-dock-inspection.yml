name: Inspect pinned Dock styling
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-dock-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - name: Resolve installed Dock source revision
        id: dock
        shell: python
        run: |
          import io, pathlib, urllib.request, zipfile, xml.etree.ElementTree as ET
          root = ET.parse('app/Directory.Packages.props').getroot()
          version = next(p.attrib['Version'] for p in root.iter('PackageVersion') if p.attrib.get('Include') == 'Dock.Avalonia.Themes.Fluent')
          url = f'https://api.nuget.org/v3-flatcontainer/dock.avalonia.themes.fluent/{version}/dock.avalonia.themes.fluent.{version}.nupkg'
          data = urllib.request.urlopen(url).read()
          z = zipfile.ZipFile(io.BytesIO(data))
          nuspec = z.read(next(n for n in z.namelist() if n.endswith('.nuspec')))
          repo = next(e for e in ET.fromstring(nuspec).iter() if e.tag.endswith('repository'))
          ref = repo.attrib['commit']
          assert len(ref) == 40 and all(c in '0123456789abcdef' for c in ref)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'ref={ref}\n')
          pathlib.Path('inspection').mkdir()
          pathlib.Path('inspection/dock.nuspec').write_bytes(nuspec)
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/Dock
          ref: ${{ steps.dock.outputs.ref }}
          path: dock
          persist-credentials: false
      - name: Archive source and provenance
        run: |
          git -C app archive --format=tar.gz HEAD > inspection/core2d.tar.gz
          git -C dock archive --format=tar.gz HEAD src docs > inspection/dock.tar.gz
          git -C app rev-parse HEAD > inspection/app-sha.txt
          git -C dock rev-parse HEAD > inspection/dock-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dock-sources
          path: inspection
          retention-days: 3
