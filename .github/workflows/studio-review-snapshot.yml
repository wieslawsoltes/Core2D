name: Studio review snapshot
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/studio-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=studio-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source-review
          path: studio-source.tar.gz
          retention-days: 1
