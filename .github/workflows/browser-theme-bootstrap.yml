name: Bootstrap browser theme
on:
  push:
    branches: [feat/figma-inspired-workspace]
    paths: [.github/workflows/browser-theme-bootstrap.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: AvaloniaUI/Avalonia
          ref: 37fbd9655cc581ff5b1c6b1fb1be4e3118c889d0
          path: upstream
          persist-credentials: false
      - name: Materialize reviewed maintainer tools
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''
          data = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest() == '41683eec13ed38cf4618abadbc7af10d6b32ff8ce376e8ded36272cf5bc02b17'
          for name, content in json.loads(data).items():
              assert name in ('tools/browser-theme/import_upstream.py', 'tools/browser-theme/skin_browser.py')
              path = Path('app') / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
      - name: Import complete pinned source and apply browser design system
        run: |
          python app/tools/browser-theme/import_upstream.py upstream app/src/Avalonia.Themes.Browser
          python app/tools/browser-theme/skin_browser.py app/src/Avalonia.Themes.Browser
      - name: Commit actual source and remove bootstrap infrastructure
        working-directory: app
        run: |
          git add src/Avalonia.Themes.Browser
          git add -f tools/browser-theme/*.py
          git rm .github/workflows/browser-theme-bootstrap.yml .github/workflows/browser-theme-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(theme): own complete Fluent-derived browser theme with portable package and source manifest'
          git push origin HEAD:feat/figma-inspired-workspace
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and pack independent theme
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          dotnet pack app/src/Avalonia.Themes.Browser/Avalonia.Themes.Browser.csproj -c Release -o artifacts/packages > artifacts/theme-build.log 2>&1
          result=$?
          set -e
          tail -n 100 artifacts/theme-build.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-theme-bootstrap
          path: artifacts
